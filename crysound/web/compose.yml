# 兆华工作伙伴：网关（按飞书身份路由到每人一个 dsh 容器）+ 每人容器所用镜像。
# 每人容器由网关自助开通（或 bin/partner-user 手工建）；公网入口 PUBLIC_HOST（网关自己做飞书登录）→ 网关 127.0.0.1:3090。
# 代码取自本仓库；部署参数写在本目录的 .env（照 .env.example 填，不进仓库）。名单、每人数据、下载文件在 PARTNER_DATA，钥匙在 PARTNER_SECURE。
# 部署：先按 market/README.md 准备私有市场，再构建 partner-image gateway 并重建服务。
name: zhaohua-partner
services:
  gateway:
    image: zhaohua-partner-gateway:market1
    build:
      context: ..
      dockerfile: web/gateway/Dockerfile
    container_name: zhaohua-partner-gateway
    command: ["node", "/app/gateway.mjs"]
    depends_on: [verdaccio]
    restart: unless-stopped
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:?在 .env 设置 PUBLIC_HOST}
      PREVIEW_HOST: ${PREVIEW_HOST:-}
      OLD_HOSTS: ${OLD_HOSTS:-}
      FEISHU_USER_AUTH_ENABLED: ${FEISHU_USER_AUTH_ENABLED:-0}
      MEEGLE_HOST: ${MEEGLE_HOST:-}
      MARKET_ADMINS: ${MARKET_ADMINS:?在 .env 设置市场管理员（首期 Jason 的已开通 slug）}
      MARKET_OFFICIAL_PUBLISHERS: ${MARKET_OFFICIAL_PUBLISHERS:-}
      MARKET_OFFICIAL_MAINTAINERS: '${MARKET_OFFICIAL_MAINTAINERS:-{}}'
      MARKET_OFFICIAL_PACKAGES: ${MARKET_OFFICIAL_PACKAGES:-}
      MAGPIE_KEYS: ${MAGPIE_KEYS:-exec}
      MAGPIE_KEY_PREFIX: ${MAGPIE_KEY_PREFIX:-magpie-}
      HOST_PARTNER_DATA: ${PARTNER_DATA:?在 .env 设置 PARTNER_DATA}
      HOST_PARTNER_CONFIG: ${PARTNER_CONFIG:?在 .env 设置 PARTNER_CONFIG}
      MAGPIE_BASE_URL: ${MAGPIE_BASE_URL:?在 .env 设置 MAGPIE_BASE_URL}
      HOST_PARTNER_SECURE: ${PARTNER_SECURE:?在 .env 设置 PARTNER_SECURE}
      FEISHU_APP_ID: ${PARTNER_FEISHU_APP_ID:?在 .env 设置 PARTNER_FEISHU_APP_ID}
      # 试用名单：这个飞书群的成员可自助开通
      PILOT_CHAT_ID: ${PILOT_CHAT_ID:?在 .env 设置 PILOT_CHAT_ID}
      PARTNER_IMAGE: zhaohua-partner:0.2.2-rc.1
    volumes:
      - ./preview:/preview:ro
      - ./gateway/gateway.mjs:/app/gateway.mjs:ro
      - ./gateway/onboard.mjs:/app/onboard.mjs:ro
      - ./gateway/company-config.mjs:/app/company-config.mjs:ro
      - ./gateway/updates.mjs:/app/updates.mjs:ro
      - type: bind
        source: ${PARTNER_CONFIG:?在 .env 设置 PARTNER_CONFIG}
        target: /opt/partner-config
        read_only: true
        bind:
          create_host_path: false
      - ./gateway/market.mjs:/app/market.mjs:ro
      - ./gateway/market-auth.mjs:/app/market-auth.mjs:ro
      - ./gateway/feishu.mjs:/app/feishu.mjs:ro
      - ../feishu:/feishu:ro
      - ${PARTNER_DATA}/users.json:/etc/partner/users.json
      - ${PARTNER_DATA}/users:/users
      - ${PARTNER_SECURE}:/secure
      - ${PARTNER_DATA}/gateway/state:/state
      - ${PARTNER_DATA}/downloads:/downloads:ro
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "127.0.0.1:3090:3090"
    networks: [partner-net]
    mem_limit: 256m
    cpus: 1

  verdaccio:
    image: verdaccio/verdaccio:6.1.6
    restart: unless-stopped
    volumes:
      - ./market/verdaccio.yaml:/verdaccio/conf/config.yaml:ro
      - ${PARTNER_SECURE}/market-htpasswd:/verdaccio/conf/htpasswd:ro
      - ${PARTNER_DATA}/npm:/verdaccio/storage
    networks: [partner-net]
    mem_limit: 512m
    cpus: 1

  # 只用来构建每人容器的镜像：docker compose --profile build build partner-image
  partner-image:
    build:
      context: ..
      dockerfile: web/Dockerfile
    image: zhaohua-partner:0.2.2-rc.1
    profiles: [build]

networks:
  partner-net:
    external: true
