<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>伙伴 · 交互原型</title>
<link rel="icon" href="../../brand/favicon.svg">
<link rel="stylesheet" href="../../brand/brand.css"><link rel="stylesheet" href="prototype.css">
<script src="prototype.js" type="module"></script>
</head>
<body>
<div class="preview-bar"><span><b>伙伴入口</b> <span class="muted">交互原型 · 示例内容</span></span><div class="preview-tools"><label>演示状态 <select id="state"><option value="idle">空闲</option><option value="thinking">思考</option><option value="working">工作</option><option value="waiting">等你确认</option><option value="done">完成</option></select></label><button id="theme" aria-label="切换深浅色">深色</button></div></div>
<div class="app">
<aside id="sidebar" aria-label="侧栏">
<div class="sidebar-top"><span class="wordmark">兆华工作伙伴</span><button id="collapse" aria-label="收起侧栏" aria-expanded="true" title="收起侧栏"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16"/></svg></button></div>
<button id="partner" class="partner selected" aria-label="伙伴 · 空闲" aria-current="page" title="伙伴 · 空闲"><span id="pet" aria-hidden="true"></span><span class="partner-copy"><strong>伙伴</strong><small id="side-status">随时找我</small></span><span id="status-dot" class="status-dot" data-state="idle" aria-hidden="true"></span></button>
<div class="below"><button class="new-task" id="new-task">＋ 新任务</button><nav class="utilities" aria-label="常用入口"><span>◇　市场</span><span><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true" style="vertical-align:-2px;margin-right:8px"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>自动化任务</span><span>▧　产物</span></nav><div class="task-heading">任务 <span>工作空间</span></div><nav id="tasks" aria-label="普通任务"><button data-task="0">整理本周客户反馈</button><button data-task="1">声学相机方案初稿</button><button data-task="2">翻译产品规格书</button></nav></div>
<div class="sidebar-foot"><span class="account">我</span><span class="account-name">我的工作空间</span></div>
</aside>
<main>
<header><div><h1 id="title">伙伴</h1><p id="subtitle">我们的对话，一直在这里。</p></div><span id="header-status" role="status">随时找我</span></header>
<div class="chat-scroll" id="chat-scroll"><div id="transcript" role="log" aria-label="对话记录" aria-live="polite"></div><section id="confirmation" hidden><h2>需要你确认</h2><p>把这份提纲继续整理成一页简报？</p><div><button id="confirm" class="primary">继续整理</button><button id="decline">先放着</button></div></section></div>
<div class="composer-wrap"><p id="return-hint">接着上次聊，或说一件新事情。</p><form id="composer"><label class="sr-only" for="message">发给伙伴</label><textarea id="message" rows="2" placeholder="今天想一起做点什么？" required></textarea><div class="composer-bottom"><span>＋　<span id="composer-context">伙伴主对话</span></span><button type="submit" class="primary" aria-label="发送消息">↑</button></div></form><p class="local-note">此处只演示交互，确认和发送都不会执行真实操作。</p></div>
</main>
</div>
</body></html>
