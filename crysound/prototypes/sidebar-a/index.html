<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>侧栏方案 A · 兆华工作伙伴</title><link rel="stylesheet" href="./style.css"></head>
<body>
<div class="app">
  <button class="scrim" aria-label="关闭导航" hidden></button>
  <aside id="sidebar" aria-label="主导航">
    <header class="brand-row"><img src="../../brand/zp-mark-32.svg" alt="兆华工作伙伴" width="26" height="26"><span class="brand-name">兆华工作伙伴</span><button class="icon-button search-trigger" aria-label="搜索对话" title="搜索对话"><i data-icon="search"></i></button><button class="icon-button collapse-trigger" aria-label="收起侧栏" title="收起侧栏"><i data-icon="panel"></i></button></header>
    <nav aria-label="主要入口">
      <button class="nav-row" data-page="new" title="新对话"><i data-icon="new" class="brand-color"></i><span>新对话</span></button>
      <button class="nav-row" data-page="works" title="作品"><i data-icon="works"></i><span>作品</span></button>
      <button class="nav-row" data-page="automation" title="自动化"><i data-icon="clock"></i><span>自动化</span></button>
      <button class="nav-row market" data-page="market" title="市场"><i data-icon="market"></i><span>市场<small>插件·技能</small></span></button>
      <div id="plugin-entries"></div>
    </nav>
    <section class="recent"><div class="section-heading"><span>最近对话</span><button class="icon-button" id="view-options" aria-label="对话显示选项" title="对话显示选项"><i data-icon="filter"></i></button></div><div id="conversation-list"></div><p class="list-empty" hidden>还没有匹配的对话</p></section>
    <footer class="account-area"><button class="account" id="account-trigger" aria-expanded="false" aria-haspopup="menu" title="个人菜单"><span class="avatar">同</span><span class="account-copy">同事<small>个人空间</small></span><i data-icon="more"></i></button><div class="account-menu popup" role="menu" hidden><button role="menuitem" id="settings"><i data-icon="settings"></i>设置</button><button role="menuitem" id="download"><i data-icon="download"></i>下载客户端</button></div></footer>
  </aside>
  <main id="main"><header class="main-header"><button id="mobile-open" class="icon-button" aria-label="打开导航"><i data-icon="panel"></i></button><span id="page-label">新对话</span><span class="review-label">方案 A · 示例数据</span></header><div id="page-content"></div><footer class="review-footer"><span>CRYSOUND WORKPARTNER</span><button id="review-options">查看方式 <i data-icon="settings"></i></button></footer></main>
</div>
<dialog id="search-dialog" aria-labelledby="search-title"><div class="dialog-heading"><h2 id="search-title">搜索对话</h2><button class="icon-button dialog-close" aria-label="关闭搜索"><i data-icon="close"></i></button></div><div class="search-field"><i data-icon="search"></i><input id="search-input" type="search" placeholder="搜索对话名称" autocomplete="off" aria-label="搜索对话名称"><kbd>Esc</kbd></div><div id="search-results"></div><p class="dialog-note">搜索当前所有工作区中的示例对话</p></dialog>
<dialog id="options-dialog" aria-labelledby="options-title"><div class="dialog-heading"><h2 id="options-title">查看方式</h2><button class="icon-button dialog-close" aria-label="关闭查看方式"><i data-icon="close"></i></button></div><p class="muted">切换原型的外观和使用场景。</p><label class="option-row">外观<select id="theme"><option value="light">浅色</option><option value="dark">深色</option></select></label><label class="option-row">运行方式<select id="shell"><option value="web">网页版</option><option value="desktop">桌面版</option></select></label><label class="option-row">工作区<select id="workspace-mode"><option value="single">只有一个</option><option value="multi">有多个</option></select></label><label class="option-row">插件入口<select id="plugin-count"><option value="0">没有额外入口</option><option value="1" selected>1 个 · 个人插件示例</option><option value="2">2 个 · 直接展示</option><option value="3">3 个 · 收进更多</option></select></label><p class="dialog-note">此处仅切换示例，不会读取或修改任何真实数据。</p></dialog>
<dialog id="list-dialog" aria-labelledby="list-title"><div class="dialog-heading"><h2 id="list-title">对话显示选项</h2><button class="icon-button dialog-close" aria-label="关闭对话选项"><i data-icon="close"></i></button></div><label class="option-row">排序<select id="sort"><option value="recent">最近更新</option><option value="title">名称</option></select></label><label class="option-row">已归档<select id="archive"><option value="hide">隐藏</option><option value="show">显示</option></select></label><p class="dialog-note">正式开发保留会话菜单、分组和工作区管理；这里只演示入口位置。</p></dialog>
<dialog id="plugins-dialog" aria-labelledby="plugins-title"><div class="dialog-heading"><h2 id="plugins-title">插件入口</h2><button class="icon-button dialog-close" aria-label="关闭插件入口"><i data-icon="close"></i></button></div><p class="muted">按安装先后排列</p><div id="plugin-menu" class="plugin-menu"></div></dialog>
<div id="toast" role="status" hidden></div>
<script src="./app.js"></script>
</body></html>
