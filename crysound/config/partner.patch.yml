# 兆华工作伙伴的默认配置：首次写入默认值，每次启动刷新公司 magpie 提供方、搜索地址/模型与网页工具上限，个人其他提供方保留。
# 模型地址由启动环境注入：桌面版连公开网关，网页版连内部模型网关；配置文件不包含部署地址。
# 默认用 ChatGPT；DeepSeek 内置路由的地址和钥匙在启动时同样改指网关。
- id: llm-pi-ai
  name: '@deepseek-ai/dsh-llm-pi-ai'
  config:
    providers:
      magpie:
        displayName: ChatGPT
        api: openai-completions
        baseURL: !!js process.env.CRYSOUND_LLM_BASE || process.env.DEEPSEEK_BASE_URL
        apiKeyEnv: MAGPIE_API_KEY
        models:
          - id: codex/gpt-6.1-sol
            name: GPT-6.1 Sol
            input: [text, image]
            contextWindow: 272000
            reasoningEfforts:
              low: low
              medium: medium
              high: high
              xhigh: xhigh
              max: max
          - id: codex/gpt-6.1-terra
            name: GPT-6.1 Terra
            input: [text, image]
            contextWindow: 272000
            reasoningEfforts:
              low: low
              medium: medium
              high: high
              xhigh: xhigh
              max: max

- id: agent-default-model
  name: '@deepseek-ai/dsh-agent-default-model'
  config:
    provider: magpie
    model: codex/gpt-6.1-sol
    reasoningEffort: medium

# 网页搜索同样经网关：搜索插件默认直连 DeepSeek 官方地址，那里不认公司网关的钥匙。
- id: web-search-deepseek
  config:
    baseURL: !!js process.env.CRYSOUND_LLM_BASE || process.env.DEEPSEEK_BASE_URL
    model: deepseek/deepseek-flash

# 两次各 10 秒的公司搜索尝试留 5 秒收尾；单页抓取输出最多 4 万字符。
- id: tool-web
  config:
    searchTimeoutMs: 25000
    fetchMaxOutputChars: 40000

# 预览版说明窗口按已读处理：新人第一次进来直接到输入框，首次进入后的飞书接入引导才不会被挡住。
- id: ui-settings-general
  name: '@deepseek-ai/dsh-client-ui-settings-general'
  config:
    welcomeNoticeVersion: 2026-09-28.1

# 工作步骤默认用“标准”（上游默认“详细”）；本人在设置里改过的保留。
- id: ui-chat
  name: '@deepseek-ai/dsh-client-ui-chat'
  config:
    transcriptView: standard

# 公司私有插件索引，安装源由 @crysound 的 .npmrc scope 映射决定。
- id: plugin-market
  config:
    indexes:
      - https://partner.invalid/_zp/market/index.json

# 上游只默认启用桌面 Browser；公司网页也需要它承接容器服务预览。
- id: ui-sidebar-browser
  name: '@deepseek-ai/dsh-client-ui-sidebar-browser'
  disabled: false
