name: CRYSOUND WorkPartner · macOS arm64 desktop

# Builds the company desktop app (apps/desktop) for Apple Silicon. The unsigned installer is always uploaded; when
# all signing secrets exist, it is also re-signed, notarized and uploaded as a second artifact. Nothing is published.
# 只在发版时手动触发。
on:
  workflow_dispatch:
    inputs:
      version:
        description: '正式版本号，例如 0.2.3（必须高于已发布版本）'
        required: true
        type: string
      update_url:
        description: 'HTTPS 网关 /_zp/updates/mac/ 目录；留空使用仓库变量 CRYSOUND_DESKTOP_UPDATE_URL'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: desktop-mac-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: macos-15
    timeout-minutes: 150
    defaults:
      run:
        shell: bash
    env:
      DSH_TELEMETRY_DISABLED: '1'
      CRYSOUND_DESKTOP_VERSION: ${{ inputs.version }}
      CRYSOUND_DESKTOP_UPDATE_URL: ${{ inputs.update_url || vars.CRYSOUND_DESKTOP_UPDATE_URL }}
      # 'true' only when every signing secret exists; the signing step is skipped otherwise.
      HAS_SIGNING: ${{ secrets.CSC_LINK != '' && secrets.CSC_KEY_PASSWORD != '' && secrets.APPLE_ID != '' && secrets.APPLE_APP_SPECIFIC_PASSWORD != '' && secrets.APPLE_TEAM_ID != '' }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v5.0.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
      - name: Validate release version and update directory
        run: node crysound/scripts/mac-update-release.mjs validate "$CRYSOUND_DESKTOP_VERSION" "$CRYSOUND_DESKTOP_UPDATE_URL"
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Company update behavior and release metadata tests
        run: node --experimental-transform-types --experimental-test-module-mocks --test crysound/scripts/mac-update-release.test.mjs crysound/scripts/company-auto-update.test.mjs crysound/web/gateway/tests/updates.test.mjs
      - name: Workspace preparation tests (template copy, install time bounds)
        run: pnpm exec vitest run apps/desktop/tests/crysound-workspace.spec.ts
      - name: Package mac-arm64 (unsigned)
        env:
          PUBLIC_HOST: ${{ vars.PUBLIC_HOST }}
        run: |
          node crysound/scripts/configure-public-host.mjs
          pnpm run package:desktop:mac:arm64:unsigned
      - name: Locate installer
        id: dmg
        run: |
          dmg=$(ls apps/desktop/.desktop-build/targets/mac-arm64/unsigned-artifacts/*.dmg | head -n1)
          test -f "$dmg"
          echo "path=$dmg" >> "$GITHUB_OUTPUT"
          ls -lh apps/desktop/.desktop-build/targets/mac-arm64/unsigned-artifacts/
      - name: Check installer contents
        run: crysound/scripts/verify-mac-package.sh "${{ steps.dmg.outputs.path }}"
      - name: Upload installer
        uses: actions/upload-artifact@v7.0.1
        with:
          name: crysound-workpartner-mac-arm64-unsigned
          path: ${{ steps.dmg.outputs.path }}
          compression-level: 0
          if-no-files-found: error
          retention-days: 14
      - name: Upload packaging logs
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: packaging-logs-${{ github.run_id }}
          path: apps/desktop/.desktop-build/packaging-runs/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
      - name: Sign and notarize (runs only when all signing secrets exist)
        if: env.HAS_SIGNING == 'true'
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: crysound/scripts/sign-mac.sh "${{ steps.dmg.outputs.path }}" signed
      - name: Verify signed installer (stapler, spctl, codesign)
        if: env.HAS_SIGNING == 'true'
        run: crysound/scripts/verify-signed.sh "$(ls signed/*.dmg | head -n1)"
      - name: Upload signed installer and update feed
        if: env.HAS_SIGNING == 'true'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: crysound-workpartner-mac-arm64-signed
          path: |
            signed/*.dmg
            signed/*.zip
            signed/latest-mac.yml
          compression-level: 0
          if-no-files-found: error
          retention-days: 14
      - name: First-run workspace smoke test (bundled plugins without network, patches, default configuration)
        env:
          SMOKE_ONLINE_BASELINE: '1'
        run: crysound/scripts/smoke-workspace.sh "${{ steps.dmg.outputs.path }}"
